name: Build Linux GDExtension

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-gdextension:
    name: Build Linux x86_64 GDExtension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gdext

      - name: Build release library
        working-directory: gdext
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload Linux library
        uses: actions/upload-artifact@v4
        with:
          name: libstacktris-linux-x86_64
          path: gdext/target/x86_64-unknown-linux-gnu/release/libstacktris.so
          if-no-files-found: error
