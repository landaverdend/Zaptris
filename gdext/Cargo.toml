[package]
name = "stacktris"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.2"
nostr-sdk = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
qrcode  = { version = "0.14", features = ["image"] }
image   = "0.25"
dotenvy    = "0.15"   # reads HOST_NWC from .env in project root
ureq       = { version = "2", features = ["json"] }
serde_json = "1"
